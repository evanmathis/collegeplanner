<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}College Planner{% endblock %} · College Planner</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('planner.dashboard') }}">College Planner</a>
  <nav>
    <a href="{{ url_for('planner.dashboard') }}">Home</a>
    <a href="{{ url_for('planner.timeline') }}">Timeline</a>
    <a href="{{ url_for('planner.schools') }}">Schools</a>
    <a href="{{ url_for('planner.tasks') }}">Tasks</a>
    <a href="{{ url_for('planner.aid') }}">Paying for college</a>
    <a href="{{ url_for('planner.questions') }}">Questions</a>
    <a href="{{ url_for('planner.calendar') }}">Calendar</a>
    {% if login_enabled and session.logged_in %}
    <form method="post" action="{{ url_for('planner.logout') }}" class="inline">
      <input type="hidden" name="_csrf" value="{{ csrf_token }}">
      <button class="link">Log out</button>
    </form>
    {% endif %}
  </nav>
</header>
<main>
  {% with messages = get_flashed_messages() %}
    {% for m in messages %}<p class="flash">{{ m }}</p>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>
</body>
</html>
